name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NEXT_PUBLIC_PANORAMAX_API_URL: ${{ vars.NEXT_PUBLIC_PANORAMAX_API_URL }}
  NEXT_PUBLIC_BUCKET_ANNUAIRE_DES_COLLECTIVITES: ${{ vars.NEXT_PUBLIC_BUCKET_ANNUAIRE_DES_COLLECTIVITES }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
